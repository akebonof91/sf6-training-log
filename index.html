<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0d11">
<link rel="manifest" href="manifest.json">
<title>さとうスト6メモ</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg: #0c0d11;
  --panel: #16181f;
  --panel-alt: #1c1f28;
  --border: #2a2d38;
  --border-soft: #21232c;
  --cyan: #29e0ff;
  --cyan-dim: #1a8ba8;
  --pink: #ff3d63;
  --pink-dim: #a8283f;
  --gold: #ffb648;
  --text: #f0f1f6;
  --text-mute: #888ca0;
  --text-faint: #565a6b;
  --radius: 10px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

.display{ font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.01em; }
.mono{ font-family:'JetBrains Mono', monospace; }

#app{
  max-width: 960px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(41,224,255,0.07), transparent 60%),
    radial-gradient(ellipse 700px 400px at 100% 0%, rgba(255,61,99,0.06), transparent 60%);
}

header{
  padding: 22px 20px 16px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom: 1px solid var(--border-soft);
}
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand .mark{
  width:10px; height:22px;
  background: linear-gradient(180deg, var(--cyan), var(--pink));
  border-radius:2px; display:inline-block;
}
.brand h1{ font-size: 24px; line-height:1; letter-spacing: 0.02em; }
.brand h1 span{ color: var(--cyan); }
.brand small{ color: var(--text-faint); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-family:'Inter',sans-serif; }
.header-actions{ display:flex; align-items:center; gap:8px; }
#syncDot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
#syncDot.ok{ background: var(--cyan); }
#syncDot.err{ background: var(--pink); }
#exportBtn{
  background:none;border:1px solid var(--border);
  color:var(--text-mute); font-size:11px; padding:6px 10px;
  border-radius:6px; cursor:pointer; font-family:'Inter',sans-serif; letter-spacing:0.03em;
}
#exportBtn:hover{ border-color:var(--cyan); color:var(--cyan); }

nav.desktop-nav{ display:none; padding: 14px 20px 0; gap: 4px; border-bottom: 1px solid var(--border-soft); }
nav.desktop-nav button{
  background:none; border:none; cursor:pointer; color: var(--text-mute);
  font-family:'Barlow Condensed', sans-serif; font-size:16px; letter-spacing:0.04em; text-transform:uppercase;
  padding: 10px 18px 12px; border-bottom: 2px solid transparent;
}
nav.desktop-nav button.active{ color: var(--text); border-bottom-color: var(--cyan); }

main{ flex:1; padding: 18px 16px 90px; }
@media (min-width: 720px){
  nav.desktop-nav{ display:flex; }
  main{ padding: 24px 24px 40px; }
  nav.mobile-nav{ display:none; }
}

.view{ display:none; animation: fadein 0.18s ease; }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.card{ background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px; }
.card + .card{ margin-top:12px; }
.section-title{ font-size:13px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.06em; margin: 22px 0 10px; }
.section-title:first-child{ margin-top:0; }

.hero-stat{
  display:flex; align-items:flex-end; gap:14px; padding: 20px 18px;
  background: linear-gradient(135deg, rgba(41,224,255,0.10), rgba(255,61,99,0.06));
  border:1px solid var(--border); border-radius: var(--radius);
}
.hero-stat .big{ font-size: 40px; line-height:1; font-family:'Barlow Condensed', sans-serif; font-weight:800; color: var(--text); }
.hero-stat .sub{ color: var(--text-mute); font-size:13px; padding-bottom:4px; }

.stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top:12px; }
.mini-stat{ background: var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding: 12px 10px; text-align:center; }
.mini-stat .num{ font-family:'Barlow Condensed'; font-weight:700; font-size:20px; }
.mini-stat .lbl{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.week-chart{ display:flex; align-items:flex-end; gap:8px; height:90px; margin-top:8px; }
.week-chart .bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
.week-chart .bar{ width:100%; max-width:28px; background: linear-gradient(180deg, var(--cyan), var(--cyan-dim)); border-radius:4px 4px 2px 2px; min-height:3px; }
.week-chart .bar.today{ background: linear-gradient(180deg, var(--gold), #b57519); }
.week-chart .lbl{ font-size:10px; color:var(--text-faint); }

.cat-bar-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
.cat-bar-row .name{ width:96px; font-size:12.5px; color:var(--text-mute); flex-shrink:0; }
.cat-bar-row .track{ flex:1; height:8px; background:var(--panel-alt); border-radius:4px; overflow:hidden; }
.cat-bar-row .fill{ height:100%; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); border-radius:4px; }
.cat-bar-row .val{ width:64px; text-align:right; font-size:11.5px; color:var(--text-faint); flex-shrink:0; }

.recent-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-soft); }
.recent-item:last-child{ border-bottom:none; }
.recent-item .left .cat{ font-size:13.5px; color:var(--text); }
.recent-item .left .meta{ font-size:11px; color:var(--text-faint); margin-top:1px; }
.recent-item .dur{ font-family:'JetBrains Mono'; color:var(--cyan); font-size:13px; }
.empty{ color:var(--text-faint); font-size:13px; padding:18px 4px; text-align:center; }

.char-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(84px,1fr)); gap:8px; }
.char-tile{ background:var(--panel); border:1px solid var(--border-soft); border-radius:8px; padding: 12px 6px; text-align:center; cursor:pointer; position:relative; transition: border-color .12s; }
.char-tile:hover{ border-color: var(--cyan-dim); }
.char-tile .name{ font-size:13px; }
.char-tile .dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; }
.dot.fav{ background: var(--cyan); }
.dot.fair{ background: var(--gold); }
.dot.bad{ background: var(--pink); }
.char-tile .noted{ position:absolute; bottom:5px; right:6px; font-size:9px; color:var(--text-faint); }

.detail-back{ background:none; border:none; color:var(--text-mute); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; margin-bottom:14px; padding:4px 0; }
.detail-back:hover{ color:var(--cyan); }
.detail-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.detail-header h2{ font-size:30px; }
.rating-row{ display:flex; gap:8px; margin-bottom:16px; }
.rating-btn{ flex:1; padding:9px 4px; border-radius:8px; border:1px solid var(--border); background:var(--panel-alt); color:var(--text-mute); font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; }
.rating-btn.sel-fav{ border-color:var(--cyan); color:var(--cyan); background:rgba(41,224,255,0.08); }
.rating-btn.sel-fair{ border-color:var(--gold); color:var(--gold); background:rgba(255,182,72,0.08); }
.rating-btn.sel-bad{ border-color:var(--pink); color:var(--pink); background:rgba(255,61,99,0.08); }

label.field-label{ font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:6px; }
textarea, input[type=text], input[type=number], input[type=date], select{
  width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif;
}
textarea{ min-height:90px; resize:vertical; line-height:1.5; }
textarea:focus, input:focus, select:focus{ outline:none; border-color:var(--cyan-dim); }

.tag-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.tag{ background:var(--panel-alt); border:1px solid var(--border); color:var(--text-mute); font-size:12px; padding:5px 9px 5px 11px; border-radius:14px; display:flex; align-items:center; gap:6px; }
.tag button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:13px; line-height:1; padding:0; }
.tag button:hover{ color:var(--pink); }
.tag-add{ display:flex; gap:8px; margin-top:10px; }
.tag-add input{ flex:1; }
.tag-add button{ padding:0 16px; }

.updated-note{ font-size:11px; color:var(--text-faint); margin-top:14px; text-align:right; }

.btn{ background: var(--panel-alt); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; cursor:pointer; font-size:13.5px; font-family:'Inter',sans-serif; }
.btn:hover{ border-color:var(--cyan-dim); }
.btn-primary{ background: var(--cyan); border-color:var(--cyan); color:#04212b; font-weight:600; }
.btn-primary:hover{ background:#4fe7ff; border-color:#4fe7ff; }
.btn-block{ width:100%; }
.btn-row{ display:flex; gap:10px; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

.timer-card{ text-align:center; padding:26px 16px; }
.timer-display{ font-family:'JetBrains Mono'; font-size:44px; font-weight:700; letter-spacing:0.02em; color:var(--text); margin: 6px 0 16px; }
.timer-display.running{ color:var(--cyan); }
.timer-setup{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; text-align:left; }
.timer-setup.solo{ grid-template-columns:1fr; }
#timerStartBtn.running{ background:var(--pink); border-color:var(--pink); color:#2b0410; }

.log-item{ display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border-soft); gap:10px; }
.log-item:last-child{ border-bottom:none; }
.log-item .tag-cat{ display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--panel-alt); color:var(--text-mute); border:1px solid var(--border); margin-bottom:4px; }
.log-item .char-name{ font-size:14px; color:var(--text); }
.log-item .note-txt{ font-size:12px; color:var(--text-faint); margin-top:3px; max-width:46ch; }
.log-item .right{ text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.log-item .dur{ font-family:'JetBrains Mono'; color:var(--cyan); font-size:15px; }
.log-item .icon-row{ display:flex; gap:2px; }
.log-item .iconbtn{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 5px; }
.log-item .iconbtn:hover{ color:var(--cyan); }
.log-item .iconbtn.danger:hover{ color:var(--pink); }

.day-group-label{ font-size:11px; color:var(--text-faint); margin:16px 0 4px; text-transform:uppercase; letter-spacing:0.04em; }
.day-group-label:first-child{ margin-top:2px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(5,6,9,0.72); display:none; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter: blur(2px); }
.modal-overlay.show{ display:flex; }
.modal{ background:var(--panel); border:1px solid var(--border); border-radius: 16px 16px 0 0; padding:20px 18px 24px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; animation: slideup 0.2s ease; }
@media (min-width:720px){ .modal-overlay{ align-items:center; } .modal{ border-radius:14px; } }
@keyframes slideup{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
.modal h3{ font-size:20px; margin-bottom:14px; }
.field{ margin-bottom:12px; }

.cal-header-row{ display:flex; justify-content:space-between; align-items:center; margin: 22px 0 10px; }
.cal-header-row .section-title{ margin:0; }
.cal-nav-group{ display:flex; align-items:center; gap:8px; }
.cal-nav-group .cal-label{ font-size:13px; color:var(--text-mute); min-width:78px; text-align:center; display:inline-block; }
.cal-nav-btn{ background:none; border:1px solid var(--border); color:var(--text-mute); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1; }
.cal-nav-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px; }
.cal-weekdays div{ text-align:center; font-size:10.5px; color:var(--text-faint); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell{ aspect-ratio:1; border-radius:6px; border:1px solid var(--border-soft); padding:4px; cursor:pointer; position:relative; }
.cal-cell.empty-cell{ border:none; cursor:default; }
.cal-cell.today{ border-color:var(--gold); }
.cal-cell.selected{ outline:2px solid var(--cyan); outline-offset:-2px; }
.cal-day{ font-size:10.5px; color:var(--text-mute); }
.cal-detail{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft); }
.cal-detail .cal-detail-head{ font-size:12.5px; color:var(--text-mute); margin-bottom:8px; }

.memo-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.memo-content{ white-space:pre-wrap; font-size:14px; line-height:1.6; flex:1; }
.memo-actions{ display:flex; gap:2px; flex-shrink:0; }
.memo-actions button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 5px; }
.memo-actions button:hover{ color:var(--cyan); }
.memo-actions button.danger:hover{ color:var(--pink); }

nav.mobile-nav{
  position: fixed; bottom:0; left:0; right:0; max-width:960px; margin:0 auto;
  background: rgba(20,22,28,0.92); backdrop-filter: blur(10px); border-top:1px solid var(--border-soft);
  display:flex; z-index:40; padding-bottom: env(safe-area-inset-bottom);
}
nav.mobile-nav button{ flex:1; background:none; border:none; cursor:pointer; padding:12px 4px 10px; color: var(--text-faint); display:flex; flex-direction:column; align-items:center; gap:4px; }
nav.mobile-nav button .ic{ width:20px; height:20px; }
nav.mobile-nav button .t{ font-size:10.5px; font-family:'Inter',sans-serif; letter-spacing:0.02em; }
nav.mobile-nav button.active{ color: var(--cyan); }

.loading{ text-align:center; padding:60px 20px; color:var(--text-faint); font-size:13px; }
.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  background: var(--pink); color:#2b0410; font-size:13px; padding:9px 16px; border-radius:8px;
  z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{ opacity:1; }
@media (min-width:720px){ .toast{ bottom:24px; } }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>さとう<span>スト6</span>メモ</h1>
        <br><small>Street Fighter 6 Practice Tracker</small>
      </div>
    </div>
    <div class="header-actions">
      <span id="syncDot" title="同期状態"></span>
      <button id="exportBtn">エクスポート</button>
    </div>
  </header>

  <nav class="desktop-nav" id="desktopNav">
    <button data-view="dashboard" class="active">ダッシュボード</button>
    <button data-view="log">練習ログ</button>
    <button data-view="memo">メモ</button>
    <button data-view="matchup">対策ノート</button>
  </nav>

  <main id="main">
    <div class="loading" id="loadingMsg">読み込み中…</div>
  </main>

  <nav class="mobile-nav" id="mobileNav" style="display:none;">
    <button data-view="dashboard" class="active">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>
      <span class="t">状況</span>
    </button>
    <button data-view="log">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span class="t">練習ログ</span>
    </button>
    <button data-view="memo">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span class="t">メモ</span>
    </button>
    <button data-view="matchup">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span class="t">対策ノート</span>
    </button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Supabase connection ----------
  const SUPABASE_URL = "https://zfnujhldcirhacncmgre.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_hHVGxT7uiVOv7Al2MdSdvA_8sPTLhsM";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CHARACTERS = ["リュウ","ルーク","春麗","ケン","ザンギエフ","ダルシム","エドモンド本田","ブランカ","ガイル","キャミィ","ディージェイ","ジェイミー","マノン","マリーザ","キンバリー","リリー","JP","ジュリ","ラシード","A.K.I.","エド","豪鬼","テリー","舞","エレナ","M.バイソン","サガット","C.ヴァイパー","アレックス","イングリッド","ヤスミン"];
  const CATEGORIES = ["トレモ","ランクマ","カジュアルマッチ","バトルハブ","カスタム","座学","その他"];
  const DAY_LABELS = ["日","月","火","水","木","金","土"];

  const now0 = new Date();
  let state = {
    sessions: [],
    matchups: {},
    memos: [],
    view: "dashboard",
    matchupOpen: null,
    timer: { running:false, startedAt:null, category:CATEGORIES[0], character:"" },
    calYear: now0.getFullYear(),
    calMonth: now0.getMonth(),
    selectedDate: null,
    editingMemoId: null
  };

  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const main = $("#main");

  function setSync(status){ $("#syncDot").className = status; }
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(()=> el.classList.remove('show'), 2200);
  }

  // ---------- Data layer (Supabase) ----------
  async function loadAll(){
    try{
      const [{data: sessions, error: e1}, {data: matchups, error: e2}, {data: memos, error: e3}] = await Promise.all([
        sb.from('practice_sessions').select('*').order('session_date', {ascending:false}),
        sb.from('matchup_notes').select('*'),
        sb.from('quick_memos').select('*').order('created_at', {ascending:false})
      ]);
      if(e1 || e2 || e3) throw (e1 || e2 || e3);
      state.sessions = (sessions||[]).map(s=>({
        id: s.id, dateISO: s.session_date, duration_sec: s.duration_sec,
        category: s.category, character: s.character||'', note: s.note||''
      }));
      state.matchups = {};
      (matchups||[]).forEach(m=>{
        state.matchups[m.character] = { notes: m.notes||'', tags: m.tags||[], rating: m.rating||null, updatedAt: m.updated_at };
      });
      state.memos = (memos||[]).map(m=>({ id:m.id, content:m.content, createdAt:m.created_at }));
      setSync('ok');
    }catch(e){
      console.error('load failed', e);
      setSync('err');
      toast('データの読み込みに失敗しました');
    }
  }

  async function addSession(session){
    try{
      const { data, error } = await sb.from('practice_sessions').insert({
        session_date: session.dateISO,
        duration_sec: session.duration_sec,
        category: session.category,
        character: session.character || null,
        note: session.note || null
      }).select().single();
      if(error) throw error;

      setSync('err');
      toast('保存に失敗しました。通信環境を確認してください');
      return false;

  // ---------- helpers ----------
  function fmtDuration(totalSec){
    totalSec = Math.max(0, Math.round(totalSec));
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    if(h>0) return `${h}時間${m}分`;
    if(m>0) return s>0 ? `${m}分${s}秒` : `${m}分`;
    return `${s}秒`;
  }
  // ローカルの日付(YYYY-MM-DD)。toISOString()はUTC変換されるため使わない(JST等で日付がずれるバグを回避)
  function todayISO(d=new Date()){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtDateShort(iso){
    const d = new Date(iso+"T00:00:00");
    return `${d.getMonth()+1}/${d.getDate()} (${DAY_LABELS[d.getDay()]})`;
  }
  function fmtDateTime(iso){
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function totalSeconds(sessions){ return sessions.reduce((a,s)=>a+s.duration_sec,0); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function switchView(v){
    state.view = v;
    state.matchupOpen = null;
    state.editingMemoId = null;
    $$('.desktop-nav button, .mobile-nav button').forEach(b=>{ b.classList.toggle('active', b.dataset.view===v); });
    render();
  }

  // ---------- Dashboard ----------
  function monthlyBuckets(n){
    const buckets = [];
    const base = new Date();
    for(let i=n-1; i>=0; i--){
      const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
      const y = d.getFullYear(), m = d.getMonth();
      const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
      const sec = state.sessions.filter(s=>s.dateISO.startsWith(prefix)).reduce((a,s)=>a+s.duration_sec,0);
      buckets.push({ label: `${m+1}月`, sec, isCurrent: i===0 });
    }
    return buckets;
  }

  function renderDashboard(){
    const total = totalSeconds(state.sessions);
    const sortedNotes = Object.entries(state.matchups).filter(([k,v])=>v && (v.notes || (v.tags&&v.tags.length)));

    const days = [];
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = todayISO(d);
      const sec = totalSeconds(state.sessions.filter(s=>s.dateISO===iso));
      days.push({iso, sec, isToday: i===0, label: DAY_LABELS[d.getDay()]});
    }
    const maxSecWeek = Math.max(...days.map(d=>d.sec), 1);
    const weekTotal = days.reduce((a,d)=>a+d.sec,0);

    let streak = 0;
    for(let i=0;i<365;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = todayISO(d);
      const has = state.sessions.some(s=>s.dateISO===iso);
      if(has) streak++;
      else if(i===0) continue;
      else break;
    }

    const catTotals = {};
    CATEGORIES.forEach(c=>catTotals[c]=0);
    state.sessions.forEach(s=>{ catTotals[s.category] = (catTotals[s.category]||0) + s.duration_sec; });
    const catMax = Math.max(...Object.values(catTotals), 1);

    const recent = [...state.sessions].sort((a,b)=> (b.dateISO+b.id).localeCompare(a.dateISO+a.id)).slice(0,5);

    const monthly = monthlyBuckets(6);
    const maxSecMonth = Math.max(...monthly.map(b=>b.sec), 1);

    // ---- calendar data ----
    const year = state.calYear, month = state.calMonth;
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const dayTotals = {};
    state.sessions.forEach(s=>{ dayTotals[s.dateISO] = (dayTotals[s.dateISO]||0) + s.duration_sec; });
    const cells = [];
    for(let i=0;i<firstWeekday;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({ day:d, iso, sec: dayTotals[iso]||0 });
    }
    const monthMax = Math.max(...cells.filter(c=>c).map(c=>c.sec), 1);
    const todayIso = todayISO();

    main.innerHTML = `
      <div class="view active">
        <div class="hero-stat">
          <div class="big">${fmtDuration(total)}</div>
          <div class="sub">総練習時間</div>
        </div>
        <div class="stat-grid">
          <div class="mini-stat"><div class="num">${fmtDuration(weekTotal)}</div><div class="lbl">今週</div></div>
          <div class="mini-stat"><div class="num">${streak}日</div><div class="lbl">連続記録</div></div>
          <div class="mini-stat"><div class="num">${sortedNotes.length}</div><div class="lbl">対策済みキャラ</div></div>
        </div>

        <div class="section-title">直近7日間</div>
        <div class="card">
          <div class="week-chart">
            ${days.map(d=>`
              <div class="bar-wrap">
                <div class="bar ${d.isToday?'today':''}" style="height:${Math.max(4,(d.sec/maxSecWeek)*100)}%" title="${fmtDuration(d.sec)}"></div>
                <div class="lbl">${d.label}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="section-title">月ごとの推移（直近6か月）</div>
        <div class="card">
          <div class="week-chart">
            ${monthly.map(b=>`
              <div class="bar-wrap">
                <div class="bar ${b.isCurrent?'today':''}" style="height:${Math.max(4,(b.sec/maxSecMonth)*100)}%" title="${fmtDuration(b.sec)}"></div>
                <div class="lbl">${b.label}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="cal-header-row">
          <div class="section-title">カレンダー</div>
          <div class="cal-nav-group">
            <button class="cal-nav-btn" id="calPrev">‹</button>
            <span class="cal-label">${year}年${month+1}月</span>
            <button class="cal-nav-btn" id="calNext">›</button>
          </div>
        </div>
        <div class="card">
          <div class="cal-weekdays">${DAY_LABELS.map(l=>`<div>${l}</div>`).join('')}</div>
          <div class="cal-grid">
            ${cells.map(c=>{
              if(!c) return `<div class="cal-cell empty-cell"></div>`;
              const intensity = c.sec>0 ? Math.min(1, 0.22+0.78*(c.sec/monthMax)) : 0;
              const isToday = c.iso===todayIso;
              const isSelected = state.selectedDate===c.iso;
              return `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${c.iso}" style="${c.sec>0?`background: rgba(41,224,255,${intensity.toFixed(2)});`:''}">
                <span class="cal-day">${c.day}</span>
              </div>`;
            }).join('')}
          </div>
          ${state.selectedDate ? renderSelectedDayDetail(state.selectedDate) : ''}
        </div>

        <div class="section-title">種類別 内訳</div>
        <div class="card">
          ${CATEGORIES.map(c=>`
            <div class="cat-bar-row">
              <div class="name">${c}</div>
              <div class="track"><div class="fill" style="width:${(catTotals[c]/catMax)*100}%"></div></div>
              <div class="val">${fmtDuration(catTotals[c])}</div>
            </div>`).join('')}
        </div>

        <div class="section-title">最近の記録</div>
        <div class="card">
          ${recent.length? recent.map(s=>`
            <div class="recent-item">
              <div class="left">
                <div class="cat">${s.category}${s.character?' ・ '+s.character:''}</div>
                <div class="meta">${fmtDateShort(s.dateISO)}</div>
              </div>
              <div class="dur">${fmtDuration(s.duration_sec)}</div>
            </div>`).join('') : `<div class="empty">まだ記録がありません。「練習ログ」タブから記録を始めましょう。</div>`}
        </div>
      </div>
    `;

    $("#calPrev").addEventListener('click', ()=>{
      state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
      state.selectedDate = null;
      renderDashboard();
    });
    $("#calNext").addEventListener('click', ()=>{
      state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
      state.selectedDate = null;
      renderDashboard();
    });
    $$('.cal-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        const d = cell.dataset.date;
        state.selectedDate = state.selectedDate===d ? null : d;
        renderDashboard();
      });
    });
  }

  function renderSelectedDayDetail(iso){
    const daySessions = state.sessions.filter(s=>s.dateISO===iso);
    const total = daySessions.reduce((a,s)=>a+s.duration_sec,0);
    return `
      <div class="cal-detail">
        <div class="cal-detail-head">${fmtDateShort(iso)} ・ 合計 ${fmtDuration(total)}</div>
        ${daySessions.length? daySessions.map(s=>`
          <div class="recent-item">
            <div class="left"><div class="cat">${s.category}${s.character?' ・ '+s.character:''}</div></div>
            <div class="dur">${fmtDuration(s.duration_sec)}</div>
          </div>`).join('') : `<div class="empty">この日の記録はありません</div>`}
      </div>
    `;
  }

      <div class="view active">

  function renderMatchupDetail(charName){
    const m = state.matchups[charName] || { notes:'', tags:[], rating:null, updatedAt:null };

    main.innerHTML = `
      <div class="view active">
        <button class="detail-back" id="backBtn">← キャラクター一覧</button>
        <div class="detail-header"><h2>${charName}</h2></div>
        <label class="field-label">この対面の印象</label>
        <div class="rating-row">
          <button class="rating-btn ${m.rating==='fav'?'sel-fav':''}" data-rating="fav">有利</button>
          <button class="rating-btn ${m.rating==='fair'?'sel-fair':''}" data-rating="fair">五分</button>
          <button class="rating-btn ${m.rating==='bad'?'sel-bad':''}" data-rating="bad">不利</button>
        </div>
        <label class="field-label">対策メモ</label>
        <textarea id="notesArea" placeholder="立ち回り、注意する連携、勝ちパターンなどを自由にメモ">${m.notes||''}</textarea>
        <label class="field-label" style="margin-top:16px; display:block;">危険な技・要注意ポイント</label>
        <div class="tag-list" id="tagList">
          ${(m.tags||[]).map((t,i)=>`<span class="tag">${escapeHtml(t)}<button data-idx="${i}">✕</button></span>`).join('') || '<span style="color:var(--text-faint); font-size:12px;">まだ登録されていません</span>'}
        </div>
        <div class="tag-add">
          <input type="text" id="tagInput" placeholder="例: 昇竜キャンセルに注意">
          <button class="btn" id="tagAddBtn">追加</button>
        </div>
        ${m.updatedAt ? `<div class="updated-note">最終更新: ${new Date(m.updatedAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
      </div>
    `;

    $("#backBtn").addEventListener('click', ()=>{ state.matchupOpen=null; render(); });

    function ensure(){
      if(!state.matchups[charName]) state.matchups[charName] = { notes:'', tags:[], rating:null, updatedAt:null };
      return state.matchups[charName];
    }
    async function persist(){
      ensure().updatedAt = new Date().toISOString();
      await saveMatchup(charName);
    }

    $$('.rating-btn').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const rec = ensure();
        rec.rating = rec.rating===b.dataset.rating ? null : b.dataset.rating;
        await persist();
        render();
      });
    });

    const notesArea = $("#notesArea");
    let debounceId;
    notesArea.addEventListener('input', ()=>{
      clearTimeout(debounceId);
      debounceId = setTimeout(async ()=>{
        ensure().notes = notesArea.value;
        await persist();
      }, 600);
    });

    $("#tagAddBtn").addEventListener('click', addTag);
    $("#tagInput").addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTag(); } });
    async function addTag(){
      const input = $("#tagInput");
      const val = input.value.trim();
      if(!val) return;
      const rec = ensure();
      rec.tags = rec.tags || [];
      rec.tags.push(val);
      await persist();
      render();
    }
    $$('#tagList .tag button').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const rec = ensure();
        rec.tags.splice(parseInt(btn.dataset.idx),1);
        await persist();
        render();
      });
    });
  }

  // ---------- Practice Log ----------
  let timerTickHandle = null;

      btn.addEventListener('click', ()=>{
        const session = state.sessions.find(s=>s.id===btn.dataset.edit);
        if(session) openManualAddModal(session);
      });
    });

    $("#manualAddBtn").addEventListener('click', ()=>openManualAddModal(null));

    const catSel = $("#timerCat"), charSel = $("#timerChar");
    if(catSel) catSel.addEventListener('change', ()=> state.timer.category = catSel.value);

  function startTimer(){
    state.timer.running = true;
    state.timer.startedAt = Date.now();
    render();
    timerTickHandle = setInterval(updateTimerDisplay, 1000);
  }

  async function stopTimer(){
    clearInterval(timerTickHandle);
    const elapsedMs = Date.now() - state.timer.startedAt;
    const seconds = Math.max(1, Math.round(elapsedMs/1000));
    const btn = $("#timerStartBtn");
    if(btn){ btn.disabled = true; btn.textContent = '保存中…'; }
    await addSession({
      dateISO: todayISO(),
      duration_sec: seconds,
      category: state.timer.category,
      character: state.timer.character || '',
      note: ''
    });
    state.timer.running = false;
    state.timer.startedAt = null;
    render();
  }

  function updateTimerDisplay(){
    const el = $("#timerDisplay");
    if(!el) return;
    if(!state.timer.running){ el.textContent = "00:00:00"; return; }
    const elapsed = Math.floor((Date.now()-state.timer.startedAt)/1000);
    const h = String(Math.floor(elapsed/3600)).padStart(2,'0');
    const m = String(Math.floor((elapsed%3600)/60)).padStart(2,'0');
    const s = String(elapsed%60).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  }

  function openManualAddModal(existingSession){
    const isEdit = !!existingSession;
    const overlay = $("#modalOverlay");
    const body = $("#modalBody");

    const initMin = isEdit ? Math.floor(existingSession.duration_sec/60) : '';
    const initSec = isEdit ? existingSession.duration_sec%60 : '';

    body.innerHTML = `
      <h3>${isEdit ? '記録を編集' : '練習記録を追加'}</h3>
      <div class="field">
        <label class="field-label">日付</label>
        <input type="date" id="mDate" value="${isEdit ? existingSession.dateISO : todayISO()}">
      </div>
      <div class="field">
        <label class="field-label">時間</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="number" id="mMin" min="0" placeholder="分" value="${initMin}" style="flex:1;">
          <span style="color:var(--text-faint); font-size:13px;">分</span>
          <input type="number" id="mSec" min="0" max="59" placeholder="秒" value="${initSec}" style="flex:1;">
          <span style="color:var(--text-faint); font-size:13px;">秒</span>
        </div>
      </div>
      <div class="field">
        <label class="field-label">種類</label>
        <select id="mCat">${CATEGORIES.map(c=>`<option value="${c}" ${isEdit && existingSession.category===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field-label">対象キャラ（任意）</label>
        <select id="mChar"><option value="">指定なし</option>${CHARACTERS.map(c=>`<option value="${c}" ${isEdit && existingSession.character===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label class="field-label">メモ（任意）</label>
        <textarea id="mNote" style="min-height:60px;" placeholder="気づいたことなど">${isEdit ? escapeHtml(existingSession.note||'') : ''}</textarea>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn" id="mCancel" style="flex:1;">キャンセル</button>
        <button class="btn btn-primary" id="mSave" style="flex:1;">${isEdit ? '更新' : '保存'}</button>
      </div>
    `;
    overlay.classList.add('show');
    $("#mCancel").addEventListener('click', closeModal);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); }, {once:true});
    $("#mSave").addEventListener('click', async ()=>{
      const min = parseInt($("#mMin").value, 10) || 0;
      const sec = parseInt($("#mSec").value, 10) || 0;
      const totalSec = min*60 + sec;
      if(totalSec<=0){ $("#mMin").style.borderColor='var(--pink)'; $("#mSec").style.borderColor='var(--pink)'; return; }
      const saveBtn = $("#mSave");
      saveBtn.disabled = true; saveBtn.textContent = isEdit ? '更新中…' : '保存中…';
      const fields = {
        dateISO: $("#mDate").value || todayISO(),
        duration_sec: totalSec,
        category: $("#mCat").value,
        character: $("#mChar").value,
        note: $("#mNote").value.trim()
      };
      const ok = isEdit ? await updateSession(existingSession.id, fields) : await addSession(fields);
      if(ok){ closeModal(); render(); }
      else{ saveBtn.disabled = false; saveBtn.textContent = isEdit ? '更新' : '保存'; }
    });
  }
  function closeModal(){ $("#modalOverlay").classList.remove('show'); }

  // ---------- Quick memo ----------
  function renderMemo(){
    main.innerHTML = `
      <div class="view active">
        <div class="card">
          <label class="field-label">新しいメモ</label>
          <textarea id="memoInput" placeholder="気づいたこと、思いついたことを一言" style="min-height:70px;"></textarea>
          <button class="btn btn-primary btn-block" id="memoAddBtn" style="margin-top:10px;">追加</button>
        </div>
        <div class="section-title">メモ一覧</div>
        ${state.memos.length? state.memos.map(m=>{
          if(state.editingMemoId === m.id){
            return `
              <div class="card" style="margin-top:8px;">
                <textarea id="editMemoArea" style="min-height:70px;">${escapeHtml(m.content)}</textarea>
                <div class="btn-row" style="margin-top:8px;">
                  <button class="btn" data-memo-cancel="${m.id}" style="flex:1;">キャンセル</button>
                  <button class="btn btn-primary" data-memo-save="${m.id}" style="flex:1;">保存</button>
                </div>
              </div>
            `;
          }
          return `
            <div class="card" style="margin-top:8px;">
              <div class="memo-card-head">
                <div class="memo-content">${escapeHtml(m.content)}</div>
                <div class="memo-actions">
                  <button data-memo-edit="${m.id}" title="編集">✎</button>
                  <button class="danger" data-memo-del="${m.id}" title="削除">✕</button>
                </div>
              </div>
              <div class="updated-note" style="text-align:left; margin-top:8px;">${fmtDateTime(m.createdAt)}</div>
            </div>
          `;
        }).join('') : `<div class="card"><div class="empty">まだメモがありません</div></div>`}
      </div>
    `;

    $("#memoAddBtn").addEventListener('click', async ()=>{
      const ta = $("#memoInput");
      const val = ta.value.trim();
      if(!val) return;
      const btn = $("#memoAddBtn");
      btn.disabled = true; btn.textContent = '保存中…';
      await addMemo(val);
      render();
    });
    $$('[data-memo-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        btn.disabled = true;
        await deleteMemo(btn.dataset.memoDel);
        render();
      });
    });
    $$('[data-memo-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.editingMemoId = btn.dataset.memoEdit;
        render();
      });
    });
    $$('[data-memo-cancel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.editingMemoId = null;
        render();
      });
    });
    $$('[data-memo-save]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.memoSave;
        const ta = $("#editMemoArea");
        const val = ta.value.trim();
        if(!val) return;
        btn.disabled = true; btn.textContent = '保存中…';
        const ok = await updateMemo(id, val);
        if(ok){ state.editingMemoId = null; }
        render();
      });
    });
  }

  // ---------- Export ----------
  async function exportData(){
    const payload = { sessions: state.sessions, matchups: state.matchups, memos: state.memos, exportedAt: new Date().toISOString() };
    const text = JSON.stringify(payload, null, 2);
    try{
      await navigator.clipboard.writeText(text);
      flashExportBtn('コピーしました');
    }catch(e){
      flashExportBtn('コピー失敗');
    }
  }
  function flashExportBtn(msg){
    const btn = $("#exportBtn");
    const orig = btn.textContent;
    btn.textContent = msg;
    setTimeout(()=>{ btn.textContent = orig; }, 1500);
  }

  function render(){
    if(state.view==='dashboard') renderDashboard();
    else if(state.view==='matchup') renderMatchup();
    else if(state.view==='log') renderLog();
    else if(state.view==='memo') renderMemo();
  }

  function isMobile(){ return window.innerWidth < 720; }
  function setupNavVisibility(){ $("#mobileNav").style.display = isMobile() ? 'flex' : 'none'; }

  async function init(){
    setupNavVisibility();
    window.addEventListener('resize', setupNavVisibility);
    $$('.desktop-nav button, .mobile-nav button').forEach(btn=>{
      btn.addEventListener('click', ()=> switchView(btn.dataset.view));
    });
    $("#exportBtn").addEventListener('click', exportData);

    await loadAll();
    render();

    if('serviceWorker' in navigator){
      // ページ単体で完結させるため、Service Workerは使わずmanifestのみでインストール可能にする
    }
  }

  init();
})();
</script>
</body>
</html>
