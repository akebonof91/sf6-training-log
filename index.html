<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0d11">
<link rel="manifest" href="manifest.json">
<title>さとうスト6メモ</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg: #0c0d11;
  --panel: #16181f;
  --panel-alt: #1c1f28;
  --border: #2a2d38;
  --border-soft: #21232c;
  --cyan: #29e0ff;
  --cyan-dim: #1a8ba8;
  --pink: #ff3d63;
  --pink-dim: #a8283f;
  --gold: #ffb648;
  --text: #f0f1f6;
  --text-mute: #888ca0;
  --text-faint: #565a6b;
  --radius: 10px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

.display{ font-family:'Barlow Condensed', sans-serif; font-weight:700; letter-spacing:0.01em; }
.mono{ font-family:'JetBrains Mono', monospace; }

#app{
  max-width: 960px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(41,224,255,0.07), transparent 60%),
    radial-gradient(ellipse 700px 400px at 100% 0%, rgba(255,61,99,0.06), transparent 60%);
}

header{
  padding: 22px 20px 16px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom: 1px solid var(--border-soft);
}
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand .mark{
  width:10px; height:22px;
  background: linear-gradient(180deg, var(--cyan), var(--pink));
  border-radius:2px; display:inline-block;
}
.brand h1{ font-size: 24px; line-height:1; letter-spacing: 0.02em; }
.brand h1 span{ color: var(--cyan); }
.brand small{ color: var(--text-faint); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-family:'Inter',sans-serif; }
.header-actions{ display:flex; align-items:center; gap:8px; }
#syncDot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
#syncDot.ok{ background: var(--cyan); }
#syncDot.err{ background: var(--pink); }
#exportBtn{
  background:none;border:1px solid var(--border);
  color:var(--text-mute); font-size:11px; padding:6px 10px;
  border-radius:6px; cursor:pointer; font-family:'Inter',sans-serif; letter-spacing:0.03em;
}
#exportBtn:hover{ border-color:var(--cyan); color:var(--cyan); }

nav.desktop-nav{ display:none; padding: 14px 20px 0; gap: 4px; border-bottom: 1px solid var(--border-soft); }
nav.desktop-nav button{
  background:none; border:none; cursor:pointer; color: var(--text-mute);
  font-family:'Barlow Condensed', sans-serif; font-size:16px; letter-spacing:0.04em; text-transform:uppercase;
  padding: 10px 18px 12px; border-bottom: 2px solid transparent;
}
nav.desktop-nav button.active{ color: var(--text); border-bottom-color: var(--cyan); }

main{ flex:1; padding: 18px 16px 90px; }
@media (min-width: 720px){
  nav.desktop-nav{ display:flex; }
  main{ padding: 24px 24px 40px; }
  nav.mobile-nav{ display:none; }
}

.view{ display:none; animation: fadein 0.18s ease; }
.view.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.card{ background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px; }
.card + .card{ margin-top:12px; }
.section-title{ font-size:13px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.06em; margin: 22px 0 10px; }
.section-title:first-child{ margin-top:0; }

.hero-stat{
  display:flex; align-items:flex-end; gap:14px; padding: 20px 18px;
  background: linear-gradient(135deg, rgba(41,224,255,0.10), rgba(255,61,99,0.06));
  border:1px solid var(--border); border-radius: var(--radius);
}
.hero-stat .big{ font-size: 40px; line-height:1; font-family:'Barlow Condensed', sans-serif; font-weight:800; color: var(--text); }
.hero-stat .sub{ color: var(--text-mute); font-size:13px; padding-bottom:4px; }

.stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-top:12px; }
.mini-stat{ background: var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding: 12px 10px; text-align:center; }
.mini-stat .num{ font-family:'Barlow Condensed'; font-weight:700; font-size:20px; }
.mini-stat .lbl{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}

.week-chart{ display:flex; align-items:flex-end; gap:8px; height:90px; margin-top:8px; }
.week-chart .bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
.week-chart .bar{ width:100%; max-width:28px; background: linear-gradient(180deg, var(--cyan), var(--cyan-dim)); border-radius:4px 4px 2px 2px; min-height:3px; }
.week-chart .bar.today{ background: linear-gradient(180deg, var(--gold), #b57519); }
.week-chart .lbl{ font-size:10px; color:var(--text-faint); }

.cat-bar-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
.cat-bar-row .name{ width:96px; font-size:12.5px; color:var(--text-mute); flex-shrink:0; }
.cat-bar-row .track{ flex:1; height:8px; background:var(--panel-alt); border-radius:4px; overflow:hidden; }
.cat-bar-row .fill{ height:100%; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); border-radius:4px; }
.cat-bar-row .val{ width:64px; text-align:right; font-size:11.5px; color:var(--text-faint); flex-shrink:0; }

.recent-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-soft); }
.recent-item:last-child{ border-bottom:none; }
.recent-item .left .cat{ font-size:13.5px; color:var(--text); }
.recent-item .left .meta{ font-size:11px; color:var(--text-faint); margin-top:1px; }
.recent-item .dur{ font-family:'JetBrains Mono'; color:var(--cyan); font-size:13px; }
.empty{ color:var(--text-faint); font-size:13px; padding:18px 4px; text-align:center; }

.char-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(84px,1fr)); gap:8px; }
.char-tile{ background:var(--panel); border:1px solid var(--border-soft); border-radius:8px; padding: 12px 6px; text-align:center; cursor:pointer; position:relative; transition: border-color .12s; }
.char-tile:hover{ border-color: var(--cyan-dim); }
.char-tile .name{ font-size:13px; }
.char-tile .dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; }
.dot.fav{ background: var(--cyan); }
.dot.fair{ background: var(--gold); }
.dot.bad{ background: var(--pink); }
.char-tile .noted{ position:absolute; bottom:5px; right:6px; font-size:9px; color:var(--text-faint); }

.detail-back{ background:none; border:none; color:var(--text-mute); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; margin-bottom:14px; padding:4px 0; }
.detail-back:hover{ color:var(--cyan); }
.detail-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.detail-header h2{ font-size:30px; }
.rating-row{ display:flex; gap:8px; margin-bottom:16px; }
.rating-btn{ flex:1; padding:9px 4px; border-radius:8px; border:1px solid var(--border); background:var(--panel-alt); color:var(--text-mute); font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; }
.rating-btn.sel-fav{ border-color:var(--cyan); color:var(--cyan); background:rgba(41,224,255,0.08); }
.rating-btn.sel-fair{ border-color:var(--gold); color:var(--gold); background:rgba(255,182,72,0.08); }
.rating-btn.sel-bad{ border-color:var(--pink); color:var(--pink); background:rgba(255,61,99,0.08); }

label.field-label{ font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:6px; }
textarea, input[type=text], input[type=number], input[type=date], select{
  width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif;
}
textarea{ min-height:90px; resize:vertical; line-height:1.5; }
textarea:focus, input:focus, select:focus{ outline:none; border-color:var(--cyan-dim); }

.tag-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.tag{ background:var(--panel-alt); border:1px solid var(--border); color:var(--text-mute); font-size:12px; padding:5px 9px 5px 11px; border-radius:14px; display:flex; align-items:center; gap:6px; }
.tag button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:13px; line-height:1; padding:0; }
.tag button:hover{ color:var(--pink); }
.tag-add{ display:flex; gap:8px; margin-top:10px; }
.tag-add input{ flex:1; }
.tag-add button{ padding:0 16px; }

.updated-note{ font-size:11px; color:var(--text-faint); margin-top:14px; text-align:right; }

.btn{ background: var(--panel-alt); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; cursor:pointer; font-size:13.5px; font-family:'Inter',sans-serif; }
.btn:hover{ border-color:var(--cyan-dim); }
.btn-primary{ background: var(--cyan); border-color:var(--cyan); color:#04212b; font-weight:600; }
.btn-primary:hover{ background:#4fe7ff; border-color:#4fe7ff; }
.btn-block{ width:100%; }
.btn-row{ display:flex; gap:10px; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

.timer-card{ text-align:center; padding:26px 16px; }
.timer-display{ font-family:'JetBrains Mono'; font-size:44px; font-weight:700; letter-spacing:0.02em; color:var(--text); margin: 6px 0 16px; }
.timer-display.running{ color:var(--cyan); }
.timer-setup{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; text-align:left; }
.timer-setup.solo{ grid-template-columns:1fr; }
#timerStartBtn.running{ background:var(--pink); border-color:var(--pink); color:#2b0410; }

.log-item{ display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border-soft); gap:10px; }
.log-item:last-child{ border-bottom:none; }
.log-item .tag-cat{ display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--panel-alt); color:var(--text-mute); border:1px solid var(--border); margin-bottom:4px; }
.log-item .char-name{ font-size:14px; color:var(--text); }
.log-item .note-txt{ font-size:12px; color:var(--text-faint); margin-top:3px; max-width:46ch; }
.log-item .right{ text-align:right; flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.log-item .dur{ font-family:'JetBrains Mono'; color:var(--cyan); font-size:15px; }
.log-item .icon-row{ display:flex; gap:2px; }
.log-item .iconbtn{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 5px; }
.log-item .iconbtn:hover{ color:var(--cyan); }
.log-item .iconbtn.danger:hover{ color:var(--pink); }

.day-group-label{ font-size:11px; color:var(--text-faint); margin:16px 0 4px; text-transform:uppercase; letter-spacing:0.04em; }
.day-group-label:first-child{ margin-top:2px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(5,6,9,0.72); display:none; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter: blur(2px); }
.modal-overlay.show{ display:flex; }
.modal{ background:var(--panel); border:1px solid var(--border); border-radius: 16px 16px 0 0; padding:20px 18px 24px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; animation: slideup 0.2s ease; }
@media (min-width:720px){ .modal-overlay{ align-items:center; } .modal{ border-radius:14px; } }
@keyframes slideup{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
.modal h3{ font-size:20px; margin-bottom:14px; }
.field{ margin-bottom:12px; }

.cal-header-row{ display:flex; justify-content:space-between; align-items:center; margin: 22px 0 10px; }
.cal-header-row .section-title{ margin:0; }
.cal-nav-group{ display:flex; align-items:center; gap:8px; }
.cal-nav-group .cal-label{ font-size:13px; color:var(--text-mute); min-width:78px; text-align:center; display:inline-block; }
.cal-nav-btn{ background:none; border:1px solid var(--border); color:var(--text-mute); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1; }
.cal-nav-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px; }
.cal-weekdays div{ text-align:center; font-size:10.5px; color:var(--text-faint); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-cell{ aspect-ratio:1; border-radius:6px; border:1px solid var(--border-soft); padding:4px; cursor:pointer; position:relative; }
.cal-cell.empty-cell{ border:none; cursor:default; }
.cal-cell.today{ border-color:var(--gold); }
.cal-cell.selected{ outline:2px solid var(--cyan); outline-offset:-2px; }
.cal-day{ font-size:10.5px; color:var(--text-mute); }
.cal-detail{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft); }
.cal-detail .cal-detail-head{ font-size:12.5px; color:var(--text-mute); margin-bottom:8px; }

.memo-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.memo-content{ white-space:pre-wrap; font-size:14px; line-height:1.6; flex:1; }
.memo-actions{ display:flex; gap:2px; flex-shrink:0; }
.memo-actions button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 5px; }
.memo-actions button:hover{ color:var(--cyan); }
.memo-actions button.danger:hover{ color:var(--pink); }

nav.mobile-nav{
  position: fixed; bottom:0; left:0; right:0; max-width:960px; margin:0 auto;
  background: rgba(20,22,28,0.92); backdrop-filter: blur(10px); border-top:1px solid var(--border-soft);
  display:flex; z-index:40; padding-bottom: env(safe-area-inset-bottom);
}
nav.mobile-nav button{ flex:1; background:none; border:none; cursor:pointer; padding:12px 4px 10px; color: var(--text-faint); display:flex; flex-direction:column; align-items:center; gap:4px; }
nav.mobile-nav button .ic{ width:20px; height:20px; }
nav.mobile-nav button .t{ font-size:10.5px; font-family:'Inter',sans-serif; letter-spacing:0.02em; }
nav.mobile-nav button.active{ color: var(--cyan); }

.loading{ text-align:center; padding:60px 20px; color:var(--text-faint); font-size:13px; }
.toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  background: var(--pink); color:#2b0410; font-size:13px; padding:9px 16px; border-radius:8px;
  z-index:60; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{ opacity:1; }
@media (min-width:720px){ .toast{ bottom:24px; } }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>さとう<span>スト6</span>メモ</h1>
        <br><small>Street Fighter 6 Practice Tracker</small>
      </div>
    </div>
    <div class="header-actions">
      <span id="syncDot" title="同期状態"></span>
      <button id="exportBtn">エクスポート</button>
    </div>
  </header>

  <nav class="desktop-nav" id="desktopNav">
    <button data-view="dashboard" class="active">ダッシュボード</button>
    <button data-view="memo">メモ</button>
    <button data-view="matchup">対策ノート</button>
    <button data-view="cfn">対戦成績</button>
  </nav>

  <main id="main">
    <div class="loading" id="loadingMsg">読み込み中…</div>
  </main>

  <nav class="mobile-nav" id="mobileNav" style="display:none;">
    <button data-view="dashboard" class="active">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>
      <span class="t">状況</span>
    </button>
    <button data-view="memo">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      <span class="t">メモ</span>
    </button>
    <button data-view="matchup">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span class="t">対策ノート</span>
    </button>
    <button data-view="cfn">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M6 4h12v3a6 6 0 0 1-12 0V4z"/><path d="M6 5H4a2 2 0 0 0 2 4M18 5h2a2 2 0 0 1-2 4"/></svg>
      <span class="t">対戦成績</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Supabase connection ----------
  const SUPABASE_URL = "https://zfnujhldcirhacncmgre.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_hHVGxT7uiVOv7Al2MdSdvA_8sPTLhsM";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CHARACTERS = ["リュウ","ルーク","春麗","ケン","ザンギエフ","ダルシム","エドモンド本田","ブランカ","ガイル","キャミィ","ディージェイ","ジェイミー","マノン","マリーザ","キンバリー","リリー","JP","ジュリ","ラシード","A.K.I.","エド","豪鬼","テリー","舞","エレナ","M.バイソン","サガット","C.ヴァイパー","アレックス","イングリッド","ヤスミン"];
  const CATEGORIES = ["トレモ","ランクマ","カジュアルマッチ","バトルハブ","カスタム","座学","その他"];
  const DAY_LABELS = ["日","月","火","水","木","金","土"];

  const now0 = new Date();
  let state = {
    matchups: {},
    memos: [],
    cfnMatches: [],
    view: "dashboard",
    matchupOpen: null,
    calYear: now0.getFullYear(),
    calMonth: now0.getMonth(),
    selectedDate: null,
    editingMemoId: null,
    cfnFilter: "all"
  };

  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const main = $("#main");

  function setSync(status){ $("#syncDot").className = status; }
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(()=> el.classList.remove('show'), 2200);
  }

  // ---------- Data layer (Supabase) ----------
  async function loadAll(){
    try{
      const [{data: matchups, error: e2}, {data: memos, error: e3}, {data: cfnMatches, error: e4}] = await Promise.all([
        sb.from('matchup_notes').select('*'),
        sb.from('quick_memos').select('*').order('created_at', {ascending:false}),
        sb.from('cfn_matches').select('*').order('played_at', {ascending:false}).limit(1000)
      ]);
      if(e2 || e3 || e4) throw (e2 || e3 || e4);
      state.matchups = {};
      (matchups||[]).forEach(m=>{
        state.matchups[m.character] = { notes: m.notes||'', tags: m.tags||[], rating: m.rating||null, updatedAt: m.updated_at };
      });
      state.memos = (memos||[]).map(m=>({ id:m.id, content:m.content, createdAt:m.created_at }));
      state.cfnMatches = (cfnMatches||[]);
      setSync('ok');
    }catch(e){
      console.error('load failed', e);
      setSync('err');
      toast('データの読み込みに失敗しました');
    }
  }

  async function saveMatchup(charName){
    const rec = state.matchups[charName];
    try{
      const { error } = await sb.from('matchup_notes').upsert({
        character: charName,
        notes: rec.notes || '',
        tags: rec.tags || [],
        rating: rec.rating || null,
        updated_at: new Date().toISOString()
      }, { onConflict: 'character' });
      if(error) throw error;
      setSync('ok');
    }catch(e){
      console.error('save matchup failed', e);
      setSync('err');
      toast('メモの保存に失敗しました');
    }
  }

  async function addMemo(content){
    try{
      const { data, error } = await sb.from('quick_memos').insert({ content }).select().single();
      if(error) throw error;
      state.memos.unshift({ id:data.id, content:data.content, createdAt:data.created_at });
      setSync('ok');
      return true;
    }catch(e){
      console.error('add memo failed', e);
      setSync('err');
      toast('メモの保存に失敗しました');
      return false;
    }
  }

  async function updateMemo(id, content){
    try{
      const { data, error } = await sb.from('quick_memos').update({ content }).eq('id', id).select().single();
      if(error) throw error;
      const idx = state.memos.findIndex(m=>m.id===id);
      if(idx>=0) state.memos[idx].content = data.content;
      setSync('ok');
      return true;
    }catch(e){
      console.error('update memo failed', e);
      setSync('err');
      toast('メモの更新に失敗しました');
      return false;
    }
  }

  async function deleteMemo(id){
    try{
      const { error } = await sb.from('quick_memos').delete().eq('id', id);
      if(error) throw error;
      state.memos = state.memos.filter(m=>m.id!==id);
      setSync('ok');
    }catch(e){
      console.error('delete memo failed', e);
      setSync('err');
      toast('削除に失敗しました');
    }
  }

  // ---------- helpers ----------
  // ローカルの日付(YYYY-MM-DD)。toISOString()はUTC変換されるため使わない(JST等で日付がずれるバグを回避)
  function todayISO(d=new Date()){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtDateShort(iso){
    const d = new Date(iso+"T00:00:00");
    return `${d.getMonth()+1}/${d.getDate()} (${DAY_LABELS[d.getDay()]})`;
  }
  function fmtDateTime(iso){
    const d = new Date(iso);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function switchView(v){
    state.view = v;
    state.matchupOpen = null;
    state.editingMemoId = null;
    $$('.desktop-nav button, .mobile-nav button').forEach(b=>{ b.classList.toggle('active', b.dataset.view===v); });
    render();
  }

  // ---------- Dashboard（対戦成績ベース） ----------
  function dateKeyLocal(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function monthlyMatchBuckets(n){
    const buckets = [];
    const base = new Date();
    for(let i=n-1; i>=0; i--){
      const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
      const y = d.getFullYear(), m = d.getMonth();
      const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
      const count = state.cfnMatches.filter(x=>dateKeyLocal(x.played_at).startsWith(prefix)).length;
      buckets.push({ label: `${m+1}月`, count, isCurrent: i===0 });
    }
    return buckets;
  }

  function renderDashboard(){
    const all = state.cfnMatches;
    const total = all.length;
    const wins = all.filter(m=>m.result==='win').length;
    const winRate = total>0 ? (wins/total*100).toFixed(1) : '0.0';

    const days = [];
    for(let i=6;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = todayISO(d);
      const count = all.filter(m=>dateKeyLocal(m.played_at)===iso).length;
      days.push({iso, count, isToday: i===0, label: DAY_LABELS[d.getDay()]});
    }
    const maxCountWeek = Math.max(...days.map(d=>d.count), 1);

    let streak = 0;
    for(let i=0;i<365;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = todayISO(d);
      const has = all.some(m=>dateKeyLocal(m.played_at)===iso);
      if(has) streak++;
      else if(i===0) continue;
      else break;
    }

    const recent = [...all].sort((a,b)=>b.played_at.localeCompare(a.played_at)).slice(0,5);

    const monthly = monthlyMatchBuckets(6);
    const maxCountMonth = Math.max(...monthly.map(b=>b.count), 1);

    // ---- calendar data ----
    const year = state.calYear, month = state.calMonth;
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const dayCounts = {};
    all.forEach(m=>{ const k = dateKeyLocal(m.played_at); dayCounts[k] = (dayCounts[k]||0) + 1; });
    const cells = [];
    for(let i=0;i<firstWeekday;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({ day:d, iso, count: dayCounts[iso]||0 });
    }
    const monthMax = Math.max(...cells.filter(c=>c).map(c=>c.count), 1);
    const todayIso = todayISO();

    main.innerHTML = `
      <div class="view active">
        <div class="hero-stat">
          <div class="big">${total}戦</div>
          <div class="sub">通算対戦数（勝率 ${winRate}%）</div>
        </div>
        <div class="stat-grid" style="grid-template-columns: repeat(2,1fr);">
          <div class="mini-stat"><div class="num">${days.reduce((a,d)=>a+d.count,0)}戦</div><div class="lbl">直近7日間</div></div>
          <div class="mini-stat"><div class="num">${streak}日</div><div class="lbl">連続対戦日数</div></div>
        </div>

        <div class="section-title">直近7日間</div>
        <div class="card">
          <div class="week-chart">
            ${days.map(d=>`
              <div class="bar-wrap">
                <div class="bar ${d.isToday?'today':''}" style="height:${Math.max(4,(d.count/maxCountWeek)*100)}%" title="${d.count}戦"></div>
                <div class="lbl">${d.label}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="section-title">月ごとの対戦数（直近6か月）</div>
        <div class="card">
          <div class="week-chart">
            ${monthly.map(b=>`
              <div class="bar-wrap">
                <div class="bar ${b.isCurrent?'today':''}" style="height:${Math.max(4,(b.count/maxCountMonth)*100)}%" title="${b.count}戦"></div>
                <div class="lbl">${b.label}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="cal-header-row">
          <div class="section-title">カレンダー</div>
          <div class="cal-nav-group">
            <button class="cal-nav-btn" id="calPrev">‹</button>
            <span class="cal-label">${year}年${month+1}月</span>
            <button class="cal-nav-btn" id="calNext">›</button>
          </div>
        </div>
        <div class="card">
          <div class="cal-weekdays">${DAY_LABELS.map(l=>`<div>${l}</div>`).join('')}</div>
          <div class="cal-grid">
            ${cells.map(c=>{
              if(!c) return `<div class="cal-cell empty-cell"></div>`;
              const intensity = c.count>0 ? Math.min(1, 0.22+0.78*(c.count/monthMax)) : 0;
              const isToday = c.iso===todayIso;
              const isSelected = state.selectedDate===c.iso;
              return `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${c.iso}" style="${c.count>0?`background: rgba(41,224,255,${intensity.toFixed(2)});`:''}">
                <span class="cal-day">${c.day}</span>
              </div>`;
            }).join('')}
          </div>
          ${state.selectedDate ? renderSelectedDayDetail(state.selectedDate) : ''}
        </div>

        <div class="section-title">最近の対戦</div>
        <div class="card">
          ${recent.length? recent.map(m=>`
            <div class="recent-item">
              <div class="left">
                <div class="cat">${m.result==='win'?'WIN':(m.result==='loss'?'LOSS':'?')} ・ ${m.my_character||'?'} vs ${m.opponent_character||'?'}</div>
                <div class="meta">${fmtDateShort(dateKeyLocal(m.played_at))}</div>
              </div>
              <div class="dur">${m.my_master_rating!=null ? 'MR '+m.my_master_rating : ''}</div>
            </div>`).join('') : `<div class="empty">まだ対戦データがありません。sync-cfn.jsを実行して同期してみてください。</div>`}
        </div>
      </div>
    `;

    $("#calPrev").addEventListener('click', ()=>{
      state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
      state.selectedDate = null;
      renderDashboard();
    });
    $("#calNext").addEventListener('click', ()=>{
      state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
      state.selectedDate = null;
      renderDashboard();
    });
    $$('.cal-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        const d = cell.dataset.date;
        state.selectedDate = state.selectedDate===d ? null : d;
        renderDashboard();
      });
    });
  }

  // ---------- CFN 対戦成績 ----------
  function monthKeyLocal(iso){
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function groupByCount(matches, keyFn){
    const map = {};
    matches.forEach(m=>{
      const k = keyFn(m) || '不明';
      if(!map[k]) map[k] = { count:0, win:0 };
      map[k].count++;
      if(m.result==='win') map[k].win++;
    });
    return map;
  }
  function sortedEntries(map){
    return Object.entries(map).sort((a,b)=>b[1].count-a[1].count);
  }

  function renderMrChartSvg(points){
    const width = 600, height = 150, pad = 10;
    const values = points.map(p=>p.y);
    const minV = Math.min(...values), maxV = Math.max(...values);
    const range = (maxV - minV) || 1;
    const stepX = points.length>1 ? (width - pad*2) / (points.length-1) : 0;
    const coords = points.map((p,i)=>{
      const x = pad + i*stepX;
      const y = pad + (height - pad*2) * (1 - (p.y - minV)/range);
      return { x, y };
    });
    const polyline = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const last = coords[coords.length-1];
    return `
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:150px; display:block;">
        <polyline points="${polyline}" fill="none" stroke="var(--cyan)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4" fill="var(--gold)"/>
      </svg>
    `;
  }

  function renderCfn(){
    const rawAll = state.cfnMatches;

    if(rawAll.length===0){
      main.innerHTML = `
        <div class="view active">
          <div class="section-title">対戦成績</div>
          <div class="card"><div class="empty">まだ同期されたデータがありません。<br>お手元のPCで sync-cfn.js を実行すると、ここにBucklerの対戦履歴が反映されます。</div></div>
        </div>
      `;
      return;
    }

    const preferredOrder = ["ランクマッチ","バトルハブ","カスタムルーム","カジュアルマッチ"];
    const typeCounts = {};
    rawAll.forEach(m=>{ const t = m.battle_type || '不明'; typeCounts[t] = (typeCounts[t]||0)+1; });
    const types = Object.keys(typeCounts).sort((a,b)=>{
      const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1;
      if(ib!==-1) return 1;
      return typeCounts[b]-typeCounts[a];
    });
    if(state.cfnFilter!=='all' && !types.includes(state.cfnFilter)) state.cfnFilter = 'all';
    const all = state.cfnFilter==='all' ? rawAll : rawAll.filter(m=>(m.battle_type||'不明')===state.cfnFilter);

    const nowKey = monthKeyLocal(new Date().toISOString());
    const monthMatches = all.filter(m=>monthKeyLocal(m.played_at)===nowKey);

    const monthTotal = monthMatches.length;
    const monthWins = monthMatches.filter(m=>m.result==='win').length;
    const monthWinRate = monthTotal>0 ? (monthWins/monthTotal*100).toFixed(1) : '0.0';

    const mrSorted = [...monthMatches].filter(m=>m.my_master_rating!=null).sort((a,b)=>a.played_at.localeCompare(b.played_at));
    const mrStart = mrSorted.length ? mrSorted[0].my_master_rating : null;
    const mrEnd = mrSorted.length ? mrSorted[mrSorted.length-1].my_master_rating : null;

    const monthOppChar = sortedEntries(groupByCount(monthMatches, m=>m.opponent_character));

    const allTotal = all.length;
    const allWins = all.filter(m=>m.result==='win').length;
    const allWinRate = allTotal>0 ? (allWins/allTotal*100).toFixed(1) : '0.0';

    const myCharAll = sortedEntries(groupByCount(all, m=>m.my_character));
    const oppCharAll = sortedEntries(groupByCount(all, m=>m.opponent_character));

    const recent = [...all].sort((a,b)=>b.played_at.localeCompare(a.played_at)).slice(0,15);

    const topOpp = monthOppChar[0];

    const mrHistoryAll = [...all]
      .filter(m=>m.my_master_rating!=null)
      .sort((a,b)=>a.played_at.localeCompare(b.played_at));
    const MR_CHART_MAX_POINTS = 200;
    const mrHistory = mrHistoryAll.slice(-MR_CHART_MAX_POINTS);
    const mrPoints = mrHistory.map(m=>({ x: m.played_at, y: m.my_master_rating }));
    const mrMin = mrPoints.length ? Math.min(...mrPoints.map(p=>p.y)) : null;
    const mrMax = mrPoints.length ? Math.max(...mrPoints.map(p=>p.y)) : null;
    const mrLatest = mrPoints.length ? mrPoints[mrPoints.length-1].y : null;

    main.innerHTML = `
      <div class="view active">
        <div class="section-title">対戦形式</div>
        <div class="rating-row" id="cfnFilterRow" style="flex-wrap:wrap;">
          <button class="rating-btn ${state.cfnFilter==='all'?'sel-fav':''}" data-filter="all" style="flex:0 0 auto; padding:9px 14px;">すべて（${rawAll.length}）</button>
          ${types.map(t=>`<button class="rating-btn ${state.cfnFilter===t?'sel-fav':''}" data-filter="${t}" style="flex:0 0 auto; padding:9px 14px;">${t}（${typeCounts[t]}）</button>`).join('')}
        </div>

        <div class="section-title">今月のサマリー（${nowKey}）</div>
        <div class="card">
          <div class="stat-grid" style="grid-template-columns: repeat(3,1fr);">
            <div class="mini-stat"><div class="num">${monthTotal}戦</div><div class="lbl">対戦数</div></div>
            <div class="mini-stat"><div class="num">${monthWinRate}%</div><div class="lbl">勝率</div></div>
            <div class="mini-stat"><div class="num">${mrStart!=null ? `${mrStart}→${mrEnd}` : '—'}</div><div class="lbl">MR推移</div></div>
          </div>
          ${topOpp ? `<div class="updated-note" style="text-align:left; margin-top:12px;">一番戦った相手: ${topOpp[0]} ${topOpp[1].count}戦（勝率 ${(topOpp[1].win/topOpp[1].count*100).toFixed(1)}%）</div>` : ''}
        </div>

        <div class="section-title">MR推移${mrHistoryAll.length>MR_CHART_MAX_POINTS ? `（直近${MR_CHART_MAX_POINTS}戦）` : ''}</div>
        <div class="card">
          ${mrPoints.length>=2 ? `
            ${renderMrChartSvg(mrPoints)}
            <div class="updated-note" style="text-align:left; margin-top:4px; display:flex; justify-content:space-between;">
              <span>最小 ${mrMin}</span>
              <span>最大 ${mrMax}</span>
              <span>現在 ${mrLatest}</span>
            </div>
          ` : `<div class="empty">MRデータがまだ足りません（ランクマッチを2戦以上同期すると表示されます）</div>`}
        </div>

        <div class="section-title">通算成績</div>
        <div class="card">
          <div class="stat-grid" style="grid-template-columns: repeat(2,1fr);">
            <div class="mini-stat"><div class="num">${allTotal}戦</div><div class="lbl">総対戦数</div></div>
            <div class="mini-stat"><div class="num">${allWinRate}%</div><div class="lbl">通算勝率</div></div>
          </div>
        </div>

        <div class="section-title">使用キャラ別成績</div>
        <div class="card">
          ${myCharAll.length ? myCharAll.map(([name,v])=>`
            <div class="cat-bar-row">
              <div class="name">${name}</div>
              <div class="track"><div class="fill" style="width:${(v.win/v.count*100)}%"></div></div>
              <div class="val">${v.count}戦 ${(v.win/v.count*100).toFixed(0)}%</div>
            </div>`).join('') : `<div class="empty">データがありません</div>`}
        </div>

        <div class="section-title">対戦相手キャラ別成績</div>
        <div class="card">
          ${oppCharAll.length ? oppCharAll.map(([name,v])=>`
            <div class="cat-bar-row">
              <div class="name">${name}</div>
              <div class="track"><div class="fill" style="width:${(v.win/v.count*100)}%"></div></div>
              <div class="val">${v.count}戦 ${(v.win/v.count*100).toFixed(0)}%</div>
            </div>`).join('') : `<div class="empty">データがありません</div>`}
        </div>

        <div class="section-title">最近の対戦</div>
        <div class="card">
          ${recent.length ? recent.map(m=>`
            <div class="recent-item">
              <div class="left">
                <div class="cat">${m.result==='win'?'WIN':(m.result==='loss'?'LOSS':'?')} ・ ${m.my_character||'?'} vs ${m.opponent_character||'?'}</div>
                <div class="meta">${new Date(m.played_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} ・ ${m.battle_type||''}</div>
              </div>
              <div class="dur" style="color:${m.result==='win'?'var(--cyan)':(m.result==='loss'?'var(--pink)':'var(--text-faint)')}">${m.my_master_rating!=null ? 'MR '+m.my_master_rating : ''}</div>
            </div>`).join('') : `<div class="empty">この対戦形式のデータはまだありません</div>`}
        </div>
      </div>
    `;

    $$('#cfnFilterRow button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.cfnFilter = btn.dataset.filter;
        renderCfn();
      });
    });
  }

  // ---------- Export ----------
  async function exportData(){
    const payload = { matchups: state.matchups, memos: state.memos, cfnMatches: state.cfnMatches, exportedAt: new Date().toISOString() };
    const text = JSON.stringify(payload, null, 2);
    try{
      await navigator.clipboard.writeText(text);
      flashExportBtn('コピーしました');
    }catch(e){
      flashExportBtn('コピー失敗');
    }
  }
  function flashExportBtn(msg){
    const btn = $("#exportBtn");
    const orig = btn.textContent;
    btn.textContent = msg;
    setTimeout(()=>{ btn.textContent = orig; }, 1500);
  }

  function render(){
    if(state.view==='dashboard') renderDashboard();
    else if(state.view==='matchup') renderMatchup();
    else if(state.view==='memo') renderMemo();
    else if(state.view==='cfn') renderCfn();
  }

  function isMobile(){ return window.innerWidth < 720; }
  function setupNavVisibility(){ $("#mobileNav").style.display = isMobile() ? 'flex' : 'none'; }

  async function init(){
    setupNavVisibility();
    window.addEventListener('resize', setupNavVisibility);
    $$('.desktop-nav button, .mobile-nav button').forEach(btn=>{
      btn.addEventListener('click', ()=> switchView(btn.dataset.view));
    });
    $("#exportBtn").addEventListener('click', exportData);

    await loadAll();
    render();

    if('serviceWorker' in navigator){
      // ページ単体で完結させるため、Service Workerは使わずmanifestのみでインストール可能にする
    }
  }

  init();
})();
</script>
</body>
</html>
